site_name: WIMU-Lab | Manual científico
site_description: Manual técnico y científico de WIMU-Lab v1.2.0
site_url: https://sportslabresearch.github.io/WIMU-Lab/
repo_url: https://github.com/SportsLabResearch/WIMU-Lab
repo_name: SportsLabResearch/WIMU-Lab
nav:
  - Inicio: index.md
  - Instalación: instalacion.md
  - Importación: importacion.md
  - GPS y gráficos: gps.md
  - Metodología: metodologia.md
theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.top
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: blue
    - scheme: slate
      primary: indigo
      accent: blue
extra_css:
  - stylesheets/extra.css
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
